---
- name: Install SharkTrustX on a dedicated Debian or Ubuntu server
  hosts: all
  become: true

  vars_files:
    - vars.yaml

  pre_tasks:
    - name: Verify the supported platform
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.service_mgr == 'systemd'
        fail_msg: This installer requires x86-64 Debian or Ubuntu with systemd.

    - name: Check for an existing SharkTrustX configuration
      ansible.builtin.stat:
        path: /opt/SharkTrustX/mako.conf
      register: sharktrustx_config

    - name: Validate required package settings
      ansible.builtin.assert:
        that:
          - settingsns1 | length > 0
          - settingsns2 | length > 0
          - settingsdn | length > 0
          - portal_local_archive | length > 0 or GitSharkTrustX | length > 0
          - mako_local_archive | length > 0 or mako_download_url | length > 0
          - mako_archive_checksum is match('^sha256:[0-9a-fA-F]{64}$')
        fail_msg: Configure the portal and a SHA-256-verified Mako release in vars.yaml.

    - name: Validate settings used to create or replace mako.conf
      ansible.builtin.assert:
        that:
          - rootuser | length > 0
          - rootpwd | length >= 12
          - rootpwd not in ['qwerty', 'CHANGE_ME']
          - realm | length > 0
          - emailserver | length > 0 and emailserver != 'your-mail-server'
          - emailto is match('^[^@\\s]+@[^@\\s]+$')
          - emailfrom is match('^[^@\\s]+@[^@\\s]+$')
          - emailport | int > 0 and emailport | int <= 65535
          - emailconsec in ['tls', 'starttls']
          - not emailuseauth or (emailuser | length > 0 and emailpassword | length > 0 and emailpassword not in ['password', 'CHANGE_ME'])
        fail_msg: Replace the credential and email placeholders before creating mako.conf.
      no_log: true
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Verify that a retained configuration loads the installed portal package
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import pathlib, re
            text = pathlib.Path('/opt/SharkTrustX/mako.conf').read_text()
            pattern = r"path\s*=\s*['\"](?:/opt/SharkTrustX/)?SharkTrustX\.zip['\"]"
            if not re.search(pattern, text):
                raise SystemExit('Retained mako.conf must load SharkTrustX.zip. Set replace_mako_conf=true after reviewing vars.yaml.')
      changed_when: false
      when: sharktrustx_config.stat.exists and not replace_mako_conf

    - name: Update apt cache if needed
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  handlers:
    - name: restart named
      ansible.builtin.systemd_service:
        name: named
        state: restarted

    - name: restart SharkTrustX
      ansible.builtin.systemd_service:
        name: SharkTrustX
        state: restarted
        daemon_reload: true
      when: start_portal | bool

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        pkg:
          - bind9
          - bind9-utils
          - bind9-dnsutils
          - ca-certificates
          - coreutils
          - git
          - libc-bin
          - python3
          - tar
          - unzip
          - util-linux
        state: present

    - name: Configure and verify authoritative DNS
      ansible.builtin.import_tasks: bind.yaml

    - name: Check for an existing portal service
      ansible.builtin.stat:
        path: /etc/systemd/system/SharkTrustX.service
      register: portal_unit

    - name: Stop the portal when start_portal is false
      ansible.builtin.systemd_service:
        name: SharkTrustX
        state: stopped
        enabled: false
      when: portal_unit.stat.exists and not (start_portal | bool)

    - name: Create the SharkTrustX runtime directory
      ansible.builtin.file:
        path: /opt/SharkTrustX
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Create persistent SharkTrustX directories
      ansible.builtin.file:
        path: "/opt/SharkTrustX/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      loop:
        - .LOCK
        - acmecert
        - cert
        - data

    - name: Create the Mako Server administrator HA1
      ansible.builtin.command:
        argv:
          - md5sum
        stdin: "{{ rootuser }}:{{ realm }}:{{ rootpwd }}"
        stdin_add_newline: false
      register: rootuserha1
      changed_when: false
      no_log: true
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Create the Mako Server SharkTrustX configuration
      ansible.builtin.template:
        src: templates/SharkTrustX-mako-conf.j2
        dest: /opt/SharkTrustX/mako.conf
        owner: root
        group: root
        mode: '0600'
        backup: "{{ replace_mako_conf }}"
      no_log: true
      notify: restart SharkTrustX
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Protect the retained Mako configuration
      ansible.builtin.file:
        path: /opt/SharkTrustX/mako.conf
        owner: root
        group: root
        mode: '0600'

    - name: Check out SharkTrustX
      ansible.builtin.git:
        repo: "{{ GitSharkTrustX }}"
        version: "{{ GitSharkTrustXVersion }}"
        dest: "{{ SharkTrustXSourceDir }}"
        update: true
      register: new_sharktrustx
      when: portal_local_archive | length == 0

    - name: Check for an installed portal package
      ansible.builtin.stat:
        path: /opt/SharkTrustX/SharkTrustX.zip
      register: sharktrustx_package

    - name: Build a staged SharkTrustX package
      community.general.archive:
        path: "{{ SharkTrustXSourceDir }}/www/"
        dest: /tmp/SharkTrustX.zip.new
        format: zip
        owner: root
        group: root
        mode: '0644'
      when: portal_local_archive | length == 0 and (new_sharktrustx.changed or not sharktrustx_package.stat.exists)

    - name: Stage a controller-provided portal package
      ansible.builtin.copy:
        src: "{{ portal_local_archive }}"
        dest: /tmp/SharkTrustX.zip.new
        mode: '0644'
      when: portal_local_archive | length > 0

    - name: Validate the selected SharkTrustX package
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys, zipfile
            required = {
                '.preload',
                '.lua/CreateDB.lua',
                '.lua/www/zones/cgen.html',
                '.lua/www/zones/cleanup.html',
                'assets/dashboard.js',
                'assets/style.css',
                'sharktrust.lsp',
            }
            with zipfile.ZipFile(sys.argv[1]) as package:
                names = set(package.namelist())
                missing = sorted(required - names)
                corrupt = package.testzip()
                preload = package.read('.preload').decode('utf-8')
                validation = package.read('.lua/www/admin/validate.html').decode('utf-8')
                if 'local function bindAccess(' not in preload or 'local function checkDNS(' not in validation:
                    raise SystemExit('Portal needs the BIND permissions and DNS delegation fixes.')
            if missing or corrupt:
                raise SystemExit('invalid portal package: missing=%r corrupt=%r' % (missing, corrupt))
          - "{{ '/tmp/SharkTrustX.zip.new' if (portal_local_archive | length > 0 or new_sharktrustx.changed or not sharktrustx_package.stat.exists) else '/opt/SharkTrustX/SharkTrustX.zip' }}"
      changed_when: false

    - name: Install the validated SharkTrustX package
      ansible.builtin.copy:
        src: /tmp/SharkTrustX.zip.new
        dest: /opt/SharkTrustX/SharkTrustX.zip
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: restart SharkTrustX
      when: portal_local_archive | length > 0 or new_sharktrustx.changed or not sharktrustx_package.stat.exists

    - name: Remove the staged SharkTrustX package
      ansible.builtin.file:
        path: /tmp/SharkTrustX.zip.new
        state: absent

    - name: Stage the controller-provided Mako release
      ansible.builtin.copy:
        src: "{{ mako_local_archive }}"
        dest: /tmp/mako.linux-x64.tar.gz
        mode: '0644'
      when: mako_local_archive | length > 0

    - name: Download the Mako release
      ansible.builtin.get_url:
        url: "{{ mako_download_url }}"
        dest: /tmp/mako.linux-x64.tar.gz
        mode: '0644'
        checksum: "{{ mako_archive_checksum | lower }}"
      when: mako_local_archive | length == 0

    - name: Hash the staged Mako release
      ansible.builtin.stat:
        path: /tmp/mako.linux-x64.tar.gz
        checksum_algorithm: sha256
      register: mako_archive_stat

    - name: Validate the staged Mako release checksum
      ansible.builtin.assert:
        that:
          - mako_archive_stat.stat.exists
          - mako_archive_checksum | lower == 'sha256:' ~ mako_archive_stat.stat.checksum
        fail_msg: The staged Mako release does not match mako_archive_checksum.

    - name: Create a private Mako staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: SharkTrustX-mako-
      register: mako_stage

    - name: Validate and install the Mako release
      block:
        - name: Unpack the staged Mako release
          ansible.builtin.unarchive:
            src: /tmp/mako.linux-x64.tar.gz
            dest: "{{ mako_stage.path }}"
            remote_src: true
          changed_when: false

        - name: Disable listeners for the runtime capability check
          ansible.builtin.copy:
            content: "port=0\nsslport=0\ntracelogger=false\n"
            dest: "{{ mako_stage.path }}/mako.conf"
            mode: '0600'

        - name: Stage the runtime capability check
          ansible.builtin.copy:
            src: files/check-runtime.lua
            dest: "{{ mako_stage.path }}/check-runtime.lua"
            mode: '0600'

        - name: Check the staged Mako executable and resources without network requests
          ansible.builtin.command:
            argv:
              - "{{ mako_stage.path }}/mako"
              - check-runtime.lua
            chdir: "{{ mako_stage.path }}"
          changed_when: false

        - name: Install Mako Server runtime files
          ansible.builtin.copy:
            src: "{{ mako_stage.path }}/{{ item.name }}"
            dest: "/usr/local/bin/{{ item.name }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ item.mode }}"
            backup: true
          loop:
            - { name: mako, mode: '0755' }
            - { name: mako.zip, mode: '0644' }
          notify: restart SharkTrustX
      always:
        - name: Remove the private Mako staging directory
          ansible.builtin.file:
            path: "{{ mako_stage.path }}"
            state: absent

    - name: Install the SharkTrustX systemd unit
      ansible.builtin.template:
        src: templates/SharkTrustX-systemd.j2
        dest: /etc/systemd/system/SharkTrustX.service
        owner: root
        group: root
        mode: '0644'
      notify: restart SharkTrustX

    - name: Apply pending SharkTrustX restarts
      ansible.builtin.meta: flush_handlers

    - name: Apply the requested SharkTrustX service state
      ansible.builtin.systemd_service:
        name: SharkTrustX
        enabled: "{{ start_portal | bool }}"
        state: "{{ 'started' if (start_portal | bool) else 'stopped' }}"
        daemon_reload: true

    - name: Wait for SharkTrustX HTTPS
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 60
      when: start_portal | bool

    - name: Verify SharkTrustX is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - SharkTrustX.service
      changed_when: false
      when: start_portal | bool

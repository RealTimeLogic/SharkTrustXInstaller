---
- hosts: all
  become: true

  vars_files:
    - vars.yaml

  pre_tasks:
    - name: Check for an existing SharkTrustX configuration
      ansible.builtin.stat:
        path: /opt/SharkTrustX/mako.conf
      register: sharktrustx_config

    - name: Validate required package settings
      ansible.builtin.assert:
        that:
          - settingsns1 | length > 0
          - settingsns2 | length > 0
          - settingsdn | length > 0
          - GitSharkTrustX | length > 0
          - mako_local_archive | length > 0 or mako_download_url | length > 0
          - mako_archive_checksum is match('^sha256:[0-9a-fA-F]{64}$')
        fail_msg: Configure the portal and a SHA-256-verified Mako release in vars.yaml.

    - name: Validate settings used to create or replace mako.conf
      ansible.builtin.assert:
        that:
          - rootuser | length > 0
          - rootpwd | length >= 12
          - rootpwd not in ['qwerty', 'CHANGE_ME']
          - realm | length > 0
          - emailserver | length > 0
          - not emailuseauth or (emailuser | length > 0 and emailpassword not in ['password', 'CHANGE_ME'])
        fail_msg: Replace the credential and email placeholders before creating mako.conf.
      no_log: true
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Update apt cache if needed
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  handlers:
    - name: restart SharkTrustX
      ansible.builtin.systemd_service:
        name: SharkTrustX
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        pkg:
          - bind9
          - curl
          - dnsutils
          - git
          - lsof
          - nano
          - unzip
          - whois
        state: present

    - name: Create the SharkTrustX runtime directory
      ansible.builtin.file:
        path: /opt/SharkTrustX
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Create persistent SharkTrustX directories
      ansible.builtin.file:
        path: "/opt/SharkTrustX/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      loop:
        - .LOCK
        - acmecert
        - cert
        - data

    - name: Create the Mako Server administrator HA1
      ansible.builtin.command:
        argv:
          - md5sum
        stdin: "{{ rootuser }}:{{ realm }}:{{ rootpwd }}"
        stdin_add_newline: false
      register: rootuserha1
      changed_when: false
      no_log: true
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Create the Mako Server SharkTrustX configuration
      ansible.builtin.template:
        src: templates/SharkTrustX-mako-conf.j2
        dest: /opt/SharkTrustX/mako.conf
        owner: root
        group: root
        mode: '0600'
        backup: "{{ replace_mako_conf }}"
      notify: restart SharkTrustX
      when: not sharktrustx_config.stat.exists or replace_mako_conf

    - name: Check out SharkTrustX
      ansible.builtin.git:
        repo: "{{ GitSharkTrustX }}"
        version: "{{ GitSharkTrustXVersion }}"
        dest: "{{ SharkTrustXSourceDir }}"
        update: true
      register: new_sharktrustx

    - name: Check for an installed portal package
      ansible.builtin.stat:
        path: /opt/SharkTrustX/SharkTrustX.zip
      register: sharktrustx_package

    - name: Build a staged SharkTrustX package
      community.general.archive:
        path: "{{ SharkTrustXSourceDir }}/www/"
        dest: /tmp/SharkTrustX.zip.new
        format: zip
        owner: root
        group: root
        mode: '0644'
      when: new_sharktrustx.changed or not sharktrustx_package.stat.exists

    - name: Validate the staged SharkTrustX package
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys, zipfile
            required = {
                '.preload',
                '.lua/CreateDB.lua',
                '.lua/www/zones/cgen.html',
                '.lua/www/zones/cleanup.html',
                'assets/dashboard.js',
                'assets/style.css',
                'sharktrust.lsp',
            }
            with zipfile.ZipFile(sys.argv[1]) as package:
                names = set(package.namelist())
                missing = sorted(required - names)
                corrupt = package.testzip()
            if missing or corrupt:
                raise SystemExit('invalid portal package: missing=%r corrupt=%r' % (missing, corrupt))
          - /tmp/SharkTrustX.zip.new
      changed_when: false
      when: new_sharktrustx.changed or not sharktrustx_package.stat.exists

    - name: Install the validated SharkTrustX package
      ansible.builtin.copy:
        src: /tmp/SharkTrustX.zip.new
        dest: /opt/SharkTrustX/SharkTrustX.zip
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      notify: restart SharkTrustX
      when: new_sharktrustx.changed or not sharktrustx_package.stat.exists

    - name: Remove the staged SharkTrustX package
      ansible.builtin.file:
        path: /tmp/SharkTrustX.zip.new
        state: absent

    - name: Stage the controller-provided Mako release
      ansible.builtin.copy:
        src: "{{ mako_local_archive }}"
        dest: /tmp/mako.linux-x64.tar.gz
        mode: '0644'
      when: mako_local_archive | length > 0

    - name: Download the Mako release
      ansible.builtin.get_url:
        url: "{{ mako_download_url }}"
        dest: /tmp/mako.linux-x64.tar.gz
        mode: '0644'
        checksum: "{{ mako_archive_checksum if mako_archive_checksum | length > 0 else omit }}"
      when: mako_local_archive | length == 0

    - name: Hash the staged Mako release
      ansible.builtin.stat:
        path: /tmp/mako.linux-x64.tar.gz
        checksum_algorithm: sha256
      register: mako_archive_stat

    - name: Validate the staged Mako release checksum
      ansible.builtin.assert:
        that:
          - mako_archive_stat.stat.exists
          - mako_archive_checksum | length == 0 or mako_archive_checksum == 'sha256:' ~ mako_archive_stat.stat.checksum
        fail_msg: The staged Mako release does not match mako_archive_checksum.

    - name: Create the Mako staging directory
      ansible.builtin.file:
        path: /tmp/SharkTrustX-mako-stage
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Unpack the staged Mako release
      ansible.builtin.unarchive:
        src: /tmp/mako.linux-x64.tar.gz
        dest: /tmp/SharkTrustX-mako-stage
        remote_src: true
      changed_when: false
      when: ansible_facts['architecture'] == 'x86_64' and ansible_facts['os_family'] == 'Debian'

    - name: Install Mako Server runtime files
      ansible.builtin.copy:
        src: "/tmp/SharkTrustX-mako-stage/{{ item.name }}"
        dest: "/usr/local/bin/{{ item.name }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: mako, mode: '0755' }
        - { name: mako.zip, mode: '0644' }
      notify: restart SharkTrustX
      when: ansible_facts['architecture'] == 'x86_64' and ansible_facts['os_family'] == 'Debian'

    - name: Verify Mako Server is installed on other platforms
      ansible.builtin.stat:
        path: /usr/local/bin/mako
      register: mako_check
      when: ansible_facts['architecture'] != 'x86_64' or ansible_facts['os_family'] != 'Debian'

    - name: Fail when Mako Server is missing on other platforms
      ansible.builtin.fail:
        msg: Mako Server is required at /usr/local/bin/mako. Install it manually or provide a supported installer task.
      when:
        - ansible_facts['architecture'] != 'x86_64' or ansible_facts['os_family'] != 'Debian'
        - not mako_check.stat.exists

    - name: Install the SharkTrustX systemd unit
      ansible.builtin.template:
        src: templates/SharkTrustX-systemd.j2
        dest: /etc/systemd/system/SharkTrustX.service
        owner: root
        group: root
        mode: '0644'
      notify: restart SharkTrustX

    - name: Apply pending SharkTrustX restarts
      ansible.builtin.meta: flush_handlers

    - name: Enable and start SharkTrustX
      ansible.builtin.systemd_service:
        name: SharkTrustX
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for SharkTrustX HTTPS
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 60

    - name: Verify SharkTrustX is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - SharkTrustX.service
      changed_when: false
